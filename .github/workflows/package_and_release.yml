name: Check and release

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check Lua syntax and compatibility
        run: |
          luac5.1 -p CleanerLootMessages.lua
          lua5.1 tests/compatibility.lua
      - name: Build without publishing
        uses: BigWigsMods/packager@v2
        with:
          args: -d
      - name: Check installable ZIP
        run: python3 tests/package.py

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package and publish
        uses: BigWigsMods/packager@v2
